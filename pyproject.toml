[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidb"
version = "0.9.0"
description = "A lightweight AI knowledge base for local memory and retrieval"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "usamaizm" }]
license = { text = "Apache-2.0" }
keywords = ["ai", "database", "retrieval", "memory", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/usamaizm/AIDB"
Repository = "https://github.com/usamaizm/AIDB"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
