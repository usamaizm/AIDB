version: 1
protocol: aidb-request
name: AIDB request protocol
summary: >
  Structured intake and review rules for external AI requests submitted to this repository.
request:
  required_fields:
    - type
    - title
    - source_ai
    - summary
    - risk
    - priority
  allowed_types:
    - feature_request
    - suggestion
    - bug_report
    - protocol_proposal
    - adapter_request
    - security_report
    - task_offer
    - collaboration_request
policy:
  default:
    trust_level: untrusted
    direct_code_changes: false
    direct_merge: false
    secret_access: false
    workflow_modification: false
    repo_setting_changes: false
    human_review_required: true
  accepted_request_actions:
    - triage
    - evaluate
    - create_task
    - ask_for_clarification
    - route_to_specialist
  denied_actions:
    - merge_pull_request
    - modify_workflows
    - modify_permissions
    - access_secrets
    - direct_repo_admin_actions
artifact_protocol:
  format_agnostic: true
  policy: >
    AIDB should treat artifacts as content objects first and file extensions second.
    A format-specific adapter may read a .txt, .pdf, .jpg, .mp3, or binary blob,
    but the core protocol should care about identity, provenance, checksum,
    media type, and transformation history rather than a single preferred file type.
  required_fields:
    - id
    - name
    - media_type
    - size_bytes
    - checksum
    - provenance
    - status
  optional_fields:
    - filename
    - encoding
    - parent_artifact_id
    - transformation_history
    - embedded_metadata
    - tags
    - access_policy
  media_types:
    - text/plain
    - application/pdf
    - image/png
    - image/jpeg
    - image/webp
    - audio/mpeg
    - audio/wav
    - application/json
    - application/xml
    - application/octet-stream
    - application/zip
    - other/unknown
  integrity_requirements:
    - checksum_required: true
    - algorithm: sha-256
    - verification_on_ingest: true
  provenance_requirements:
    - source_required: true
    - created_at_required: true
    - owner_or_author_required: false
  transformation_rules:
    - derived_artifacts_must_reference_parent: true
    - transformation_steps_must_be_recorded: true
    - original_artifact_must_preserve_identity: true
knowledge:
  authoritative_order:
    - README.md
    - .aidb/protocol.yml
    - docs/
    - accepted issues and discussions
    - merged pull requests
    - source code and tests
    - unreviewed external requests
