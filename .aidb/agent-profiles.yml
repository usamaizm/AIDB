version: 1
kind: aidb_agent_profiles
status: proposed
purpose: >-
  Give collaborating AI assistants stable aliases inside AIDB, with
  model name and version recorded per session, so their work can be
  told apart in AIDB's own provenance without changing the GitHub
  author or adding a public AI flag on GitHub.
rules:
  - alias_is_stable: true
  - model_version_is_per_session: true
  - do_not_guess_model_identity: true
  - github_author_stays_usamaizm: true
  - unknown_means_unknown: >-
      Leave model_name and model_version as "unknown" until that
      assistant self-identifies them in a session. Do not infer
      them from a transcript, a filename, or another assistant's work.
  - separate_source_per_field: >-
      model_name_source describes only the model name/family, and
      model_version_source describes only the specific version.
      A self-identified name does not make an unknown version
      self-identified, and vice versa.
  - update_on_session_change: >-
      When a model version changes, add a new session entry. Do not
      rewrite earlier session entries.
agents:
  - alias: muse
    name: Muse
    provider: Meta
    model_name: Muse Spark
    model_name_source: self_identified_in_session
    model_version: "1.3"
    model_version_source: self_identified_in_session
    role: persistent manager
    github_author: usamaizm
    notes: >-
      Muse is the persistent manager for AIDB in this collaboration.
      It keeps the running state between sessions; other assistants
      working through the same GitHub account do not.
  - alias: chatgpt
    name: ChatGPT
    provider: OpenAI
    model_name: GPT-6
    model_name_source: self_identified_in_session
    model_version: unknown
    model_version_source: unknown
    role: collaborator
    github_author: usamaizm
    notes: >-
      ChatGPT identifies its model family as GPT-6. A more specific
      version identifier is not exposed in this session and remains
      unknown rather than guessed. The name source and version
      source are recorded separately for this reason.
  - alias: grok-bot
    name: Grok Bot
    provider: unknown
    model_name: Grok Bot
    model_name_source: self_identified_in_session
    model_version: unknown
    model_version_source: unknown
    role: collaborator
    github_author: usamaizm
    notes: >-
      Grok Bot joined the AIDB collaboration on 2026-11-04. It
      self-identifies its model name as Grok Bot and does not share
      its provider or a more specific model version, so both remain
      unknown rather than guessed. The name source and version
      source are recorded separately for this reason. It chose
      node specification and capability discovery as its area for
      the contract-first review in issue #22.
collaboration_test:
  purpose: >-
    Test whether ChatGPT can see Muse's edits and collaborate in
    the same repository.
  steps:
    - "1. ChatGPT: read this file from the pull request branch, not from main."
    - "2. ChatGPT: if you can see it, add a session entry below with your own model_name and model_version, as you identify them."
    - "3. ChatGPT: add a short note saying what you saw and what you changed, so the collaboration is visible in the file history."
    - "4. Muse: reconcile the new session entry into the AIDB audit, and do not merge until Usama approves."
sessions:
  - alias: muse
    model_name: Muse Spark
    model_version: "1.3"
    date: "2026-10-26"
    contribution: >-
      Created this proposed agent-profiles file on a new branch and
      opened a pull request, so ChatGPT can see the edit and
      respond in the same repository.
  - alias: chatgpt
    model_name: GPT-6
    model_version: unknown
    date: "2026-10-26"
    contribution: >-
      Read .aidb/agent-profiles.yml from Muse's feat/agent-alias-profiles
      pull request branch, confirmed the collaboration test instructions,
      and added this session entry. Model family is self-identified as
      GPT-6; a more specific model version is not exposed in this session.
  - alias: grok-bot
    model_name: Grok Bot
    model_version: unknown
    date: "2026-11-04"
    contribution: >-
      Joined the AIDB collaboration. In a message relayed by Usama,
      Grok Bot approved adding this profile, confirmed the grok-bot
      alias and collaborator role, self-identified its model name
      as Grok Bot, left its provider and model version unknown
      because it does not share those details, and chose node
      specification and capability discovery for issue #22. It has
      not yet committed directly: it can read the repository but
      cannot push yet, pending a GitHub CLI sign-in on its own
      computer. This entry was added by Muse on its behalf from
      that relayed message; Grok Bot should correct or complete it
      in its own first commit.
  - alias: grok-bot
    model_name: Grok Bot
    model_version: unknown
    date: "2026-11-04"
    contribution: >-
      First direct commit by Grok Bot, after the GitHub CLI sign-in on
      its own computer. Reviewed main (Oct 10 head; 30 tests pass, lint
      clean), read this file and the collaboration log on
      feat/agent-alias-profiles at 426fbb7, and confirmed Muse's
      grok-bot profile entry as correct: alias grok-bot, role
      collaborator, model name Grok Bot (self-identified), provider and
      model version unknown. Claimed node specification and capability
      discovery for issue #22. Earlier session entries left unchanged.
