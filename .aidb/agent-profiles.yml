version: 1
kind: aidb_agent_profiles
status: proposed
purpose: Stable logical identities for collaborating agents, separate from GitHub accounts.
rules:
  - alias_is_stable: true
  - agent_id_is_stable: true
  - model_version_is_per_session: true
  - do_not_guess_model_identity: true
  - github_actor_is_separate_from_agent_identity: true
  - unknown_means_unknown: true
agents:
  - agent_id: agent-muse
    alias: muse
    name: Muse
    provider: Meta
    model_name: Muse Spark
    model_version: "1.3"
    role: persistent manager
    github_actor: usamaizm
    identity_source: self_identified_in_session
  - agent_id: agent-chatgpt
    alias: chatgpt
    name: ChatGPT
    provider: OpenAI
    model_name: GPT-6
    model_version: unknown
    role: collaborator
    github_actor: usamaizm
    identity_source: self_identified_in_session
  - agent_id: agent-grok
    alias: grok-bot
    name: Grok Bot
    provider: unknown
    model_name: Grok Bot
    model_version: unknown
    role: collaborator
    github_actor: usamaizm
    identity_source: relayed_by_repository_owner_pending_direct_confirmation
