name: PR contributor attribution

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-attribution:
    name: Validate contributor metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base revision only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate metadata from the event payload
        run: python scripts/check_pr_attribution.py
