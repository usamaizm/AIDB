name: AIDB Request Triage

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  triage:
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.issue.labels.*.name, ','), 'aidb:request')
    runs-on: ubuntu-latest
    steps:
      - name: Validate, label, and acknowledge request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const definitions = [
              ['aidb:review', '5319e7'],
              ['status:triage', 'fbca04'],
              ['source:external-ai', '7057ff'],
              ['status:accepted', '0e8a16'],
              ['status:rejected', 'b60205'],
              ['status:needs-clarification', 'd876e3'],
            ];
            for (const [name, color] of definitions) {
              try {
                await github.rest.issues.getLabel({ ...repo, name });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...repo, name, color });
              }
            }
            await github.rest.issues.addLabels({
              ...repo,
              issue_number: issue.number,
              labels: ['aidb:review', 'status:triage', 'source:external-ai'],
            });
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...repo,
              issue_number: issue.number,
              per_page: 100,
            });
            const marker = '<!-- aidb-triage -->';
            if (!comments.some(comment => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                ...repo,
                issue_number: issue.number,
                body: `${marker}\nThanks for submitting an AIDB request. This request is now in review.\n\nIt will be evaluated before becoming a task, code change, or pull request. Human review is required for implementation and approval.\n\nNext states: \`status:accepted\`, \`status:rejected\`, or \`status:needs-clarification\`.`,
              });
            }
